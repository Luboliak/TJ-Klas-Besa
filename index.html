<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2022">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Klas Beša">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>TJ Klas Beša</title>
<style>
:root{
  --bg:#1E2022; --panel:#26292C; --panel2:#2E3134; --line:#383C40;
  --ink:#F1F1EE; --mute:#979CA1; --inv:#F1F1EE; --inv-ink:#1E2022;
  --win:#6DAA75; --loss:#CF6A5C; --draw:#8C9095;
  --cond:"sans-serif-condensed","Roboto Condensed","Arial Narrow",sans-serif;
}
:root.light{
  --bg:#F2F3F4; --panel:#FFFFFF; --panel2:#E9EBED; --line:#D5D8DB;
  --ink:#232628; --mute:#696E73; --inv:#2B2E31; --inv-ink:#FFFFFF;
  --win:#3E8A4A; --loss:#B4473A; --draw:#7A7F84;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Roboto,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* hlavička */
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
header img{width:40px;height:40px;object-fit:contain}
.hname{flex:1;min-width:0}
.hname b{display:block;font-family:var(--cond);font-size:20px;letter-spacing:.3px;line-height:1.1}
.hname span{color:var(--mute);font-size:13px}
.ibtn{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:grid;place-items:center}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}

main{padding:12px 12px 84px;max-width:720px;margin:0 auto}
.note{color:var(--mute);font-size:13px;margin:6px 2px 12px}
h2{font-family:var(--cond);font-size:18px;margin:18px 2px 8px;font-weight:700}

/* spodná navigácia */
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:10px 2px 9px;color:var(--mute);font-family:var(--cond);font-size:15px;border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--ink)}
nav small{display:block;font-size:11px;opacity:.6;font-family:Roboto,sans-serif}

/* tabuľka ligy */
.lt{width:100%;border-collapse:collapse}
.lt th{font-weight:400;color:var(--mute);font-size:12px;text-align:right;padding:4px 5px}
.lt th.l{text-align:left}
.lt td{padding:7px 5px;text-align:right;border-bottom:1px solid var(--line)}
.lt td.pos{width:26px;color:var(--mute);font-family:var(--cond)}
.lt td.tm{text-align:left;width:100%}
.lt td.tm div{display:flex;align-items:center;gap:8px}
.lt td.tm img{width:22px;height:22px;object-fit:contain;flex:none}
.lt td.pts{font-family:var(--cond);font-size:17px;font-weight:700}
.lt tr.us td{background:var(--inv);color:var(--inv-ink);border-bottom-color:var(--inv)}
.lt tr.us td.pos{color:var(--inv-ink)}
.lt tr.us td:first-child{border-radius:6px 0 0 6px}
.lt tr.us td:last-child{border-radius:0 6px 6px 0}
.hide-s{display:table-cell}
@media (max-width:380px){.hide-s{display:none}}

.form{display:flex;gap:6px;margin:4px 2px}
.fr{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-family:var(--cond);font-weight:700;color:#fff}
.fr.V{background:var(--win)} .fr.P{background:var(--loss)} .fr.R{background:var(--draw)}

/* zápasy */
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;background:var(--panel);border:0;padding:9px;color:var(--mute)}
.seg button.on{background:var(--inv);color:var(--inv-ink)}
.next{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:6px}
.next .when{color:var(--mute);font-size:13px}
.next .vs{font-family:var(--cond);font-size:22px;line-height:1.2;margin:4px 0}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.mrow .d{width:52px;flex:none;color:var(--mute);font-size:12px;line-height:1.2}
.mrow .t{flex:1;min-width:0}
.mrow .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .t .me{font-weight:700}
.mrow .s{font-family:var(--cond);font-size:17px;text-align:right;min-width:34px}
.mrow .s div{line-height:1.25}
.res{width:24px;height:24px;flex:none;border-radius:5px;display:grid;place-items:center;font-family:var(--cond);font-size:13px;color:#fff}
.res.V{background:var(--win)} .res.P{background:var(--loss)} .res.R{background:var(--draw)} .res.x{background:none;border:1px solid var(--line)}
.kolo{font-family:var(--cond);color:var(--mute);margin:14px 4px 2px;font-size:14px}

/* dochádzka / výplata */
.mbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mbar b{flex:1;text-align:center;font-family:var(--cond);font-size:19px}
.acts{display:flex;gap:8px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px}
.btn.pri{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.btn.grow{flex:1}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--loss)}
.ev{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.ev .tag{width:28px;height:28px;flex:none;border-radius:6px;display:grid;place-items:center;font-family:var(--cond);font-weight:700;border:1px solid var(--line)}
.ev .tag.Z{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.ev .x{flex:1;min-width:0}
.ev .x small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .n{font-family:var(--cond);font-size:18px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--mute)}

.pay{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;align-items:center}
.pay .h{color:var(--mute);font-size:12px;text-align:right}
.pay .h.l{text-align:left}
.pay .c{text-align:right}
.pay .nm{padding:8px 0;border-top:1px solid var(--line)}
.pay .c,.pay .pb{border-top:1px solid var(--line);padding:8px 0}
.pay .sum{font-family:var(--cond);font-size:17px}
.paid{color:var(--win);font-size:12px}
.tot{display:flex;gap:10px;margin-top:14px}
.tot div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.tot small{color:var(--mute);display:block}
.tot b{font-family:var(--cond);font-size:22px}

/* modálne okno */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px 20px;border-top:1px solid var(--line)}
.sheet h3{font-family:var(--cond);font-size:20px;margin:2px 0 12px;display:flex;align-items:center;gap:8px}
.sheet h3 span{flex:1}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;color:var(--mute);font-size:13px;margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.pl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:5px}
.pl .ck{width:24px;height:24px;border-radius:6px;border:2px solid var(--mute);flex:none;display:grid;place-items:center}
.pl.on .ck{background:var(--ink);border-color:var(--ink)}
.pl.on .ck::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pl.off{opacity:.45}
.lgsel{margin-bottom:10px;font-family:var(--cond);font-size:17px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow .x{flex:1;min-width:0}
.lrow small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.stbl td,.stbl th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.stbl th{color:var(--mute);font-weight:400}
pre.diag{white-space:pre-wrap;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:240px;overflow:auto}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--inv);color:var(--inv-ink);padding:9px 16px;border-radius:8px;z-index:30;display:none;max-width:90vw}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:14px}
summary{font-family:var(--cond);font-size:16px;cursor:pointer}
.tr{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;gap:12px;align-items:center}
.tr .dd{width:46px;flex:none;text-align:center;font-family:var(--cond);line-height:1.1}
.tr .dd b{display:block;font-size:22px}
.tr .dd span{color:var(--mute);font-size:12px}
.tr .x{flex:1;min-width:0}
.tr .x small{display:block;color:var(--mute)}
.tr.past{opacity:.5}
.tr.first{background:var(--inv);color:var(--inv-ink);border-color:var(--inv)}
.tr.first .dd span,.tr.first .x small{color:var(--inv-ink);opacity:.75}
.news{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.news small{color:var(--mute)}
.news b{display:block;font-family:var(--cond);font-size:18px;margin:2px 0 4px}
.news p{margin:0;white-space:pre-wrap}
.hint{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.hint div{flex:1}
.mrow{cursor:pointer}
.mrow .ref{font-size:12px;color:var(--mute);margin-top:2px}
.live{display:inline-block;background:var(--loss);color:#fff;font-family:var(--cond);font-size:12px;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.next{cursor:pointer}
.next .ref{color:var(--mute);font-size:13px;margin-top:4px}
.dh{text-align:center;margin-bottom:12px}
.dh small{color:var(--mute);display:block}
.dsc{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0 4px}
.dsc .tn{font-family:var(--cond);font-size:17px;line-height:1.15}
.dsc .tn.h{text-align:right}
.dsc .big{font-family:var(--cond);font-size:38px;font-weight:700;min-width:84px;text-align:center}
.evr{display:grid;grid-template-columns:1fr 44px 1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center;font-size:14px}
.evr .m{text-align:center;font-family:var(--cond);color:var(--mute)}
.evr .h{text-align:right}
.lu{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.lu h4{font-family:var(--cond);margin:8px 0 4px;font-weight:400;color:var(--mute)}
.lu div div{padding:2px 0}
.lu .nr{display:inline-block;width:24px;color:var(--mute);font-family:var(--cond)}
.refs div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.refs span{color:var(--mute)}
.ldot{display:inline-block;min-width:17px;height:17px;line-height:17px;border-radius:9px;background:var(--loss);color:#fff;font-size:11px;font-family:Roboto,sans-serif;vertical-align:2px}
nav button{font-size:13.5px;padding-left:0;padding-right:0}
.src{color:var(--mute);font-size:12px;margin:22px 2px 4px;text-align:center}
.src a{color:inherit}
.st th button{background:none;border:0;padding:2px 4px;color:var(--mute);font:inherit;font-size:12px}
.st th button.on{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.st tr{cursor:pointer}
.st td.tm div{white-space:nowrap}
.st td.tm .nr,.nr{display:inline-block;width:24px;color:var(--mute);font-family:var(--cond)}
.mute{color:var(--mute)}
.warn{display:inline-block;width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--loss);color:#fff;text-align:center;font-size:11px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tiles.t5{grid-template-columns:repeat(5,1fr)}
.tiles div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.tiles small{display:block;color:var(--mute);font-size:12px}
.tiles b{font-family:var(--cond);font-size:22px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles b.tname{font-size:17px;line-height:1.6}
@media (max-width:420px){.tiles.t5{grid-template-columns:repeat(3,1fr)}}
.albs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.alb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-start}
.alb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--panel2)}
.alb span{display:block;padding:8px 10px}
.alb small{display:block;color:var(--mute)}
.phg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ph{padding:0;border:0;background:var(--panel2);border-radius:4px;overflow:hidden}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.lb{display:flex;justify-content:center;background:#000;border-radius:8px;overflow:hidden;touch-action:pan-y}
.lb img{max-width:100%;max-height:70vh;display:block}
a.btn{text-decoration:none;display:inline-block;text-align:center;color:inherit}
.kl p{margin:6px 0}
.kl a{color:inherit}
.kl .gap{height:8px}
.kr{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.kr span:last-child{text-align:right}
.topic{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;flex:1;font-size:14px;overflow-wrap:anywhere}
.pm{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pmn{flex:1;min-width:0}
.pmn small{display:block;color:var(--mute)}
.form.sm{margin:0;gap:4px}
.form.sm .fr{width:24px;height:24px;font-size:13px}
.chart{width:100%;height:auto;display:block}
.chart .cg{stroke:var(--line);stroke-width:1}
.chart .ct{fill:var(--mute);font-size:11px;font-family:Roboto,sans-serif}
.chart .cl{fill:var(--ink);font-size:13px;font-weight:700;font-family:Roboto,sans-serif}
.chart .cline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cdot{fill:var(--ink);stroke:var(--bg);stroke-width:2}
.chart .chit{fill:transparent}
.chart .cpt:hover .cdot,.chart .cpt:focus .cdot{r:6}
.lu .pll{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.tools{margin:6px 0 10px}
.wx{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.wxi{font-size:28px;line-height:1}
.wx small{display:block;color:var(--mute)}
.feed{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.feed .ft{font-family:var(--cond);color:var(--mute);min-width:38px}
.feed p{margin:2px 0 0;white-space:pre-wrap}
.rsvp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:-2px 0 10px}
.rsq{font-family:var(--cond);font-size:17px;margin-bottom:8px}
.rsq small{font-family:Roboto,sans-serif;font-size:13px;color:var(--mute)}
.rsvp .acts{margin-bottom:6px}
.rsn{margin:4px 0 0}
.rsg{font-size:14px;margin-top:6px}
.rsg small{display:block;color:var(--mute)}
.lnk{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chead{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-bottom:8px}
.clist{padding-bottom:6px}
.cday{text-align:center;color:var(--mute);font-size:12px;margin:14px 0 6px}
.cm{display:flex;flex-direction:column;align-items:flex-start;margin-top:8px}
.cm.cont{margin-top:2px}
.cm.me{align-items:flex-end}
.cn{font-size:12px;color:var(--mute);margin:0 0 2px 10px}
.cb{max-width:82%;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 11px 5px}
.cm.me .cb{background:var(--inv);color:var(--inv-ink);border-color:var(--inv);border-radius:14px 14px 4px 14px}
.cm.cont .cb{border-radius:14px}
.cm.pend .cb{opacity:.6}
.ctx{white-space:pre-wrap;overflow-wrap:anywhere}
.ctx a{color:inherit}
.ct{display:block;text-align:right;font-size:11px;opacity:.65;margin-top:2px}
.cdel{font-size:11px;margin-left:6px}
.cin{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:8px 0 4px}
.cin textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:9px 14px;max-height:140px;font:inherit;color:inherit}
.cin .btn{border-radius:18px}
.mvpb{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid #E3B341;border-radius:8px;padding:10px 12px;margin-bottom:10px}
.mvpb.done{border-left-color:var(--line)}
.mvpb .mvi{font-size:24px;line-height:1}
.mvpb small{display:block;color:var(--mute)}
.mvr{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line)}
.mvr.win{font-weight:700}
</style>
</head>
<body>
<header>
  <img id="logo" src="logo.png" alt="Logo TJ Klas Beša">
  <div class="hname"><b>TJ Klas Beša</b><span id="hsub">VII. liga ObFZ Levice</span></div>
  <button class="ibtn" id="bTheme" title="Svetlý / tmavý režim" aria-label="Režim zobrazenia"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="ibtn" id="bRefresh" title="Obnoviť" aria-label="Obnoviť"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
</header>

<main id="view"><p class="note">Načítavam…</p></main>

<nav id="nav">
  <button data-t="tab" class="on">Tabuľka</button>
  <button data-t="zap">Zápasy</button>
  <button data-t="live">Live</button>
  <button data-t="tren">Tréningy</button>
  <button data-t="chat">Chat</button>
  <button data-t="klub">Klub</button>
</nav>
<div class="toast" id="toast"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="nastavenie.js"></script>
<script>
const US='TJ Klas Beša', BYE='Nez. družstvo';
// V Android appke je APP_BASE adresa webu na GitHube, odkiaľ sa berú všetky údaje. Na webe je prázdne.

/* CSV z Google tabuľky */
function csv(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
function pDate(s){
  s=(s||'').trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})?/);
  if(m){ const y=m[3]||new Date().getFullYear(); return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
  return null;
}
async function sheet(url){
  if(!url) return null;
  const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  return csv(await r.text()).slice(1);
}

/* aktuality zo súboru aktuality.txt v repozitári (Google tabuľka nepovinná) */
function parseAkt(txt){
  return txt.replace(/\r/g,'').split(/^\s*---+\s*$/m).map(b=>{
    const lines=b.split('\n').filter(l=>!/^\s*#/.test(l));
    while(lines.length && !lines[0].trim()) lines.shift();
    if(!lines.length) return null;
    const first=lines.shift().trim(); let d='', n=first;
    const m=first.match(/^(\d{1,2}\.\s*\d{1,2}\.\s*\d{0,4})\s*[|\-–]\s*(.*)$/);
    if(m){ d=m[1]; n=m[2]; }
    return [d, n, lines.join('\n').trim()];
  }).filter(Boolean);
}
/* tréningy zo súboru treningy.txt: pravidelné dni + zmeny, zrušenia a prestávky */
const DEN={'nedela':0,'nedeľa':0,'pondelok':1,'utorok':2,'streda':3,'stvrtok':4,'štvrtok':4,'piatok':5,'sobota':6};
function parseTren(txt){
  const reg=[], extra=new Map(), pauses=[];
  txt.replace(/\r/g,'').split('\n').forEach(raw=>{
    const l=raw.trim(); if(!l || l.startsWith('#')) return;
    let m=l.match(/^pravideln[eé][^:|]*:\s*(.*)$/i);
    if(m){ const p=m[1].split('|').map(x=>x.trim()); const dw=DEN[(p[0]||'').toLowerCase()]; if(dw!=null) reg.push({dw,cas:p[1]||'',kde:p[2]||'',pozn:p[3]||''}); return; }
    m=l.match(/^prest[aá]vka[^:|]*:\s*(.+?)\s*[-–]\s*(.+?)\s*(?:\|\s*(.*))?$/i);
    if(m){ const a=pDate(m[1]), b=pDate(m[2]); if(a&&b) pauses.push([a,b]); return; }
    const p=l.split('|').map(x=>x.trim()); const d=pDate(p[0]); if(!d) return;
    if(/^zru[sš]en/i.test(p[1]||'')) extra.set(d,{d,cas:'',kde:'',pozn:'ZRUŠENÝ'+(p[2]?' – '+p[2]:''),zrus:true});
    else extra.set(d,{d,cas:p[1]||'',kde:p[2]||'',pozn:p[3]||''});
  });
  const out=new Map(), t0=new Date(), from=new Date(t0.getTime()-21*864e5), to=new Date(t0.getTime()+70*864e5);
  for(let x=new Date(from); x<=to; x.setDate(x.getDate()+1)){
    const d=iso(x); if(pauses.some(([a,b])=>d>=a&&d<=b)) continue;
    reg.filter(r=>r.dw===x.getDay()).forEach(r=>out.set(d,{d,cas:r.cas,kde:r.kde,pozn:r.pozn}));
  }
  extra.forEach((v,d)=>{ const o=out.get(d); out.set(d, v.zrus||!o ? v : {...o, ...Object.fromEntries(Object.entries(v).filter(([k,val])=>val))}); });
  return [...out.values()].map(x=>[x.d,x.cas,x.kde,x.pozn,x.zrus?1:0]);
}
async function trenSource(){
  if(typeof TRENINGY_CSV!=='undefined' && TRENINGY_CSV) return sheet(TRENINGY_CSV);
  const r=await fetch(BASE+'treningy.txt',{cache:'no-store'});
  if(r.status===404) return [];
  if(!r.ok) throw new Error('HTTP '+r.status);
  return parseTren(await r.text());
}
async function aktSource(){
  if(typeof AKTUALITY_CSV!=='undefined' && AKTUALITY_CSV) return sheet(AKTUALITY_CSV);
  const r=await fetch(BASE+'aktuality.txt',{cache:'no-store'});
  if(r.status===404) return [];
  if(!r.ok) throw new Error('HTTP '+r.status);
  return parseAkt(await r.text());
}

}

}

/* ===== live a detail zápasu ===== */
const PROXY = (typeof PROXY_URL!=='undefined' && PROXY_URL) ? PROXY_URL.replace(/\/$/,'') : '';
const LIVE = {};   // id zápasu -> posledný detail z proxy
function liveInfo(d){
  if(!d) return null;
  if(d.closed) return null;
  const t=d.timer; if(!t) return null;
  const lim={'1HT':45,'2HT':90,'1ET':105,'2ET':120};
  let cur=null, ended=null;
  ['1HT','2HT','1ET','2ET'].forEach(ph=>{ const x=t[ph]; if(!x||!x.start) return; if(x.end) ended=ph; else cur=[ph,x]; });
  if(cur){
    const min=Math.floor((cur[1].start.seconds+(Date.now()-new Date(cur[1].start.date))/1000)/60)+1;
    return {label: min>lim[cur[0]] ? lim[cur[0]]+"+'" : Math.max(1,min)+"'"};
  }
  if(ended==='1HT') return {label:'Polčas'};
  return null;
}
function score(m){
  const d=LIVE[m.id];
  if(d && (d.closed || liveInfo(d)) && d.score) return [d.score[0], d.score[1]];
  return played(m) ? [m.hs, m.as] : null;
}
function findMatch(id){ for(const l of LIGY) for(const m of l.matches||[]) if(m.id===id) return m; return null; }

function mRow(m,our,forceLabel){
  const sc=score(m), li=liveInfo(LIVE[m.id]) || (forceLabel?{label:forceLabel}:null);
  const r = our && sc && !li ? (sc[0]===sc[1]?'R':((m.home===US)===(sc[0]>sc[1])?'V':'P')) : null;
  const scH = sc ? `<div>${sc[0]}</div><div>${sc[1]}</div>` : `<div style="font-size:13px;color:var(--mute)">${esc(m.time||'')}</div>`;
  const nm=x=>esc(x===BYE?'voľno':x);
  const click = m.home!==BYE && m.away!==BYE ? `data-mid="${esc(m.id)}"` : '';
  return `<div class="mrow" ${click}><div class="d">${dLabel(m.date)}${m.round?'<br>'+m.round+'. kolo':''}</div><div class="t"><div class="${m.home===US?'me':''}">${nm(m.home)}${li?`<span class="live">${li.label}</span>`:''}</div><div class="${m.away===US?'me':''}">${nm(m.away)}</div>${m.ref?`<div class="ref">R: ${esc(m.ref)}</div>`:''}</div><div class="s">${scH}</div>${our?`<div class="res ${r||'x'}">${r||''}</div>`:''}</div>`;
}

async function getDetail(m, preferLive){
  if(PROXY && preferLive && m.url){
    try{ const r=await fetch(PROXY+'/?zapas='+encodeURIComponent(m.url),{cache:'no-store'}); if(r.ok){ const j=await r.json(); if(!j.error){ LIVE[m.id]=j; return j; } } }catch(e){}
  }
  try{ const r=await fetch(BASE+'data/zapasy/'+m.id+'.json',{cache:'no-store'}); if(r.ok){ const j=await r.json(); if(!PROXY || !LIVE[m.id]) LIVE[m.id]=j; return j; } }catch(e){}
  return null;
}
function nearNow(m){
  if(!m.date||!m.time) return false;
  const st=new Date(m.date+'T'+m.time).getTime(), now=Date.now();
  return now>st-20*60000 && now<st+150*60000;
}

async function openMatch(id){
  const m=findMatch(id); if(!m) return;
  sheetMatch=id;
  openSheet(`<h3><span>${esc(m.home)} – ${esc(m.away)}</span><button class="ibtn" data-close="1" aria-label="Zavrieť"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3><p class="note">Načítavam detail…</p>`);
  const d=await getDetail(m, true);
  if(sheetMatch!==id) return;
  $('#sheet').innerHTML=vDetail(m,d); fillWx($('#sheet')); fillRsvp($('#sheet')); fillMvp($('#sheet'));
  clearInterval(sheetTimer);
  if(PROXY && d && !d.closed && nearNow(m)){
    sheetTimer=setInterval(async()=>{ const x=await getDetail(m,true); if(sheetMatch===id && x){ $('#sheet').innerHTML=vDetail(m,x); fillWx($('#sheet')); render(); } }, 60000);
  }
}

function evIcon(e){
  if(e.t==='goal') return '⚽'+(e.k==='dropped'||/own/.test(e.k||'')?' (vlastný)':/penal/.test(e.k||'')?' (11 m)':'');
  if(/red/.test(e.t)) return '🟥';
  if(/yellow/.test(e.t)) return '🟨';
  return '';
}
function vDetail(m,d){
  const close=`<button class="ibtn" data-close="1" aria-label="Zavrieť"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  let h=`<h3><span>${d&&d.round?d.round+'. kolo':'Zápas'}</span>${close}</h3>`;
  const started = d && (d.closed || (d.timer && Object.keys(d.timer).length));
  const li=liveInfo(d);
  const sc = started && d.score ? d.score : (played(m)?[m.hs,m.as]:null);
  h+=`<div class="dh"><small>${dLabel(m.date)} o ${esc(m.time||'?')}${d&&d.ground?', '+esc(d.ground):''}</small>
    <div class="dsc"><div class="tn h">${esc(m.home)}</div><div class="big">${sc?sc[0]+':'+sc[1]:'–'}</div><div class="tn">${esc(m.away)}</div></div>
    <small>${li?`<span class="live">${li.label}</span>`:d&&d.closed?'Koniec':''}${d&&d.phases&&d.phases[0]&&(d.closed||li)?' polčas '+d.phases[0][0]+':'+d.phases[0][1]:''}</small></div>`;
  if((m.home===US||m.away===US) && m.date && m.time && Date.now()>=mvpWin(m).opens && Date.now()<=mvpWin(m).closes+30*864e5) h+=`<div data-mvpslot="${esc(m.id)}"></div>`;
  if(!(d&&d.closed) && !played(m)) h+=matchTools(m,d)+preMatch(m);
  if(!d){ return h+(played(m)?'<div class="empty">Detail tohto zápasu zatiaľ nie je k dispozícii.</div>':''); }
  const ev=(d.events||[]).filter(e=>e.t!=='substitution').sort((a,b)=>(+a.min||0)-(+b.min||0));
  if(ev.length){
    h+='<h2>Priebeh</h2>'+ev.map(e=>{ const txt=`${evIcon(e)} ${esc(e.p||'')}`; return `<div class="evr"><div class="h">${e.side==='home'?txt:''}</div><div class="m">${esc(e.min)}'</div><div>${e.side==='away'?txt:''}</div></div>`; }).join('');
  } else if(d.closed) h+='<p class="note">V zápase neboli zapísané góly ani karty.</p>';
  const subs=(d.events||[]).filter(e=>e.t==='substitution');
  if(subs.length) h+='<details><summary>Striedania</summary>'+subs.map(e=>`<div class="evr"><div class="h">${e.side==='home'?esc(e.r||'')+' za '+esc(e.p||''):''}</div><div class="m">${esc(e.min)}'</div><div>${e.side==='away'?esc(e.r||'')+' za '+esc(e.p||''):''}</div></div>`).join('')+'</details>';
  h+='<h2>Rozhodcovia</h2>';
  h+= d.refs&&d.refs.length ? '<div class="refs">'+d.refs.map(r=>`<div><span>${esc(r.role)}</span><b>${esc(r.name)}</b></div>`).join('')+'</div>' : '<p class="note">Obsadenie rozhodcov zatiaľ nie je zverejnené.</p>';
  const L=d.lineups||{};
  if(L.home||L.away){
    const col=(x,us)=>{ if(!x) return '<div class="note">Bez zostavy</div>';
      const known=n=>us&&KLUB&&(KLUB.hraci||[]).some(p=>p.name===n);
      const pl=(arr)=>arr.map(p=>`<div><span class="nr">${p.nr??''}</span>${known(p.name)?`<span class="pll" data-pl="${esc(p.name)}">${esc(p.name)}</span>`:esc(p.name)}${p.c?' (C)':''}${p.gk?' (B)':''}</div>`).join('');
      const coach=(x.crew||[]).find(c=>c.pos==='coach');
      return pl(x.players.filter(p=>!p.sub))+(x.players.some(p=>p.sub)?'<h4>Náhradníci</h4>'+pl(x.players.filter(p=>p.sub)):'')+(coach?`<h4>Tréner</h4><div>${esc(coach.name)}</div>`:'');
    };
    h+=`<h2>Zostavy</h2><div class="lu"><div><h4>${esc(m.home)}</h4>${col(L.home,m.home===US)}</div><div><h4>${esc(m.away)}</h4>${col(L.away,m.away===US)}</div></div>`;
  }
  const at=d.at?new Date(d.at):null;
  h+=`<p class="note" style="margin-top:14px">${at?`Údaje z ${at.getDate()}.${at.getMonth()+1}. ${at.getHours()}:${String(at.getMinutes()).padStart(2,'0')}${d.live?' (živo)':''}. `:''}${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener" style="color:inherit">Otvoriť na Sportnete</a>`:''}</p>`;
  return h;
}

/* živé výsledky v zozname: zápasy, ktoré práve bežia alebo začínajú */

/* ===== LIVE sekcia: zápasy zo všetkých sledovaných líg, ktoré sa hrajú dnes ===== */
function startTs(m){ return new Date(m.date+'T'+(m.time||'00:00')).getTime(); }
function isLiveNow(m){
  const d=LIVE[m.id];
  if(d && d.closed) return false;
  if(liveInfo(d)) return true;
  const s=startTs(m), now=Date.now();
  return !played(m) && now>=s && now<s+115*60000;
}
function liveCount(){
  const t=today(); let n=0;
  allLeagues().forEach(l=>(l.matches||[]).forEach(m=>{ if(m.date===t && m.home!==BYE && m.away!==BYE && isLiveNow(m)) n++; }));
  return n;
}
function liveGroup(list, labelFn){
  const by=new Map();
  list.forEach(x=>{ if(!by.has(x.l.name)) by.set(x.l.name,[]); by.get(x.l.name).push(x.m); });
  let h='';
  by.forEach((ms,name)=>{ h+=`<div class="kolo">${esc(name)}</div>`+ms.sort(byDate).map(m=>mRow(m,false,labelFn?labelFn(m):null)).join(''); });
  return h;
}
function vLive(){
  const t=today(), rows=[];
  allLeagues().forEach(l=>(l.matches||[]).forEach(m=>{ if(m.date===t && m.home!==BYE && m.away!==BYE) rows.push({l,m}); }));
  let h='';
  const live=rows.filter(x=>isLiveNow(x.m)), rest=rows.filter(x=>!isLiveNow(x.m));
  h+=mvpSlots();
  if(live.length) h+='<h2 style="margin-top:4px">Práve sa hrá</h2>'+liveGroup(live, m=>liveInfo(LIVE[m.id])?null:'hrá sa');
  h+=vFeed();
  if(rest.length) h+='<h2>Dnes</h2>'+liveGroup(rest);
  if(!rows.length){
    let nd=null;
    allLeagues().forEach(l=>(l.matches||[]).forEach(m=>{ if(m.date && m.date>t && m.home!==BYE && m.away!==BYE && (!nd||m.date<nd)) nd=m.date; }));
    h+='<div class="empty">Dnes sa v sledovaných ligách nehrá žiadny zápas.</div>';
    if(nd){
      const nx=[]; allLeagues().forEach(l=>(l.matches||[]).forEach(m=>{ if(m.date===nd && m.home!==BYE && m.away!==BYE) nx.push({l,m}); }));

  return h;
}

/* ===== TABUĽKA: doma / vonku a vývoj poradia ===== */
let tabMode='all';
function computeTable(l, mode, upto){
  const rows=new Map((l.teams||[]).map(t=>[t.name,{name:t.name,slug:t.slug,z:0,v:0,r:0,p:0,gf:0,ga:0,b:0}]));
  (l.matches||[]).forEach(m=>{
    if(m.hs==null || m.home===BYE || m.away===BYE) return;
    if(upto!=null && (m.round==null || m.round>upto)) return;
    [[m.home,m.hs,m.as,'home'],[m.away,m.as,m.hs,'away']].forEach(([n,f,a,s])=>{
      if(mode!=='all' && mode!==s) return;
      const t=rows.get(n); if(!t) return;
      t.z++; t.gf+=f; t.ga+=a;
      if(f>a){ t.v++; t.b+=3; } else if(f===a){ t.r++; t.b+=1; } else t.p++;
    });
  });
  return [...rows.values()].sort((a,b)=>b.b-a.b||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name,'sk'))
    .map((t,i)=>({...t,pos:i+1,g:t.gf+':'+t.ga}));
}
function positionHistory(l){
  const rounds=[...new Set((l.matches||[]).filter(m=>m.hs!=null&&m.round!=null).map(m=>m.round))].sort((a,b)=>a-b);
  return rounds.map(r=>{ const t=computeTable(l,'all',r); const us=t.find(x=>x.name===US); return us&&us.z?{r,pos:us.pos,b:us.b}:null; }).filter(Boolean);
}
function posChart(l){
  const hist=positionHistory(l), n=(l.teams||[]).length;
  if(hist.length<2 || !n) return '';
  const W=340,H=150,pl=26,pr=12,pt=12,pb=24;
  const x=i=>pl+(W-pl-pr)*(hist.length===1?0.5:i/(hist.length-1));
  const y=p=>pt+(H-pt-pb)*((p-1)/Math.max(1,n-1));
  const grid=[1,Math.ceil(n/2),n].map(p=>`<line x1="${pl}" x2="${W-pr}" y1="${y(p)}" y2="${y(p)}" class="cg"/><text x="${pl-6}" y="${y(p)+4}" class="ct" text-anchor="end">${p}.</text>`).join('');
  const xl=hist.map((h,i)=>(i===0||i===hist.length-1||hist.length<=10||i%2===0)?`<text x="${x(i)}" y="${H-6}" class="ct" text-anchor="middle">${h.r}.</text>`:'').join('');
  const path=hist.map((h,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(h.pos).toFixed(1)).join(' ');
  const last=hist[hist.length-1], best=Math.min(...hist.map(h=>h.pos)), bi=hist.findIndex(h=>h.pos===best);
  const dots=hist.map((h,i)=>`<g class="cpt" tabindex="0"><circle cx="${x(i)}" cy="${y(h.pos)}" r="12" class="chit"/><circle cx="${x(i)}" cy="${y(h.pos)}" r="4" class="cdot"/><title>Po ${h.r}. kole: ${h.pos}. miesto, ${h.b} b</title></g>`).join('');
  const ly=y(last.pos), lab=`<text x="${x(hist.length-1)-8}" y="${ly<pt+16?ly+18:ly-10}" class="cl" text-anchor="end">${last.pos}.</text>`;
  return `<h2>Vývoj poradia Beše</h2><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Poradie Beše po jednotlivých kolách">${grid}<path d="${path}" class="cline"/>${dots}${lab}</svg>
    <p class="note">Os x je kolo, os y miesto v tabuľke. Teraz ${last.pos}. miesto, najlepšie ${best}. miesto (po ${hist[bi].r}. kole). Počítané z výsledkov zápasov.</p>`;
}

/* ===== PRED ZÁPASOM ===== */
function leagueOf(m){ return LIGY.find(l=>(l.matches||[]).some(x=>x.id===m.id)); }

/* ===== IHRISKÁ, NAVIGÁCIA, POČASIE ===== */
let IHR={};
// GPS, ktoré je od Beše ďalej ako 90 km, je na Sportnete zjavne zle zadané: použije sa hľadanie podľa názvu
const BESA_GEO=[48.141,18.407];
const okGeo=g=>g&&Math.hypot((g[0]-BESA_GEO[0])*111,(g[1]-BESA_GEO[1])*74)<90?g:null;
function groundOf(m,d){
  const g=IHR[m.home]||{};
  const ground=(d&&d.ground)||g.ground, geo=okGeo(d&&d.geo)||okGeo(g.geo);
  return ground||geo?{ground,geo}:null;
}
function navUrl(m,d){
  const g=groundOf(m,d);
  if(g&&g.geo) return `https://www.google.com/maps/dir/?api=1&destination=${g.geo[0]},${g.geo[1]}`;
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(((g&&g.ground)||'Futbalové ihrisko')+' '+m.home);
}
const WMO=[[0,'☀️','jasno'],[1,'🌤️','prevažne jasno'],[2,'⛅','polojasno'],[3,'☁️','zamračené'],[45,'🌫️','hmla'],[48,'🌫️','hmla'],
  [51,'🌦️','mrholenie'],[56,'🌧️','mrznúce mrholenie'],[61,'🌧️','dážď'],[63,'🌧️','dážď'],[65,'🌧️','silný dážď'],[66,'🌧️','mrznúci dážď'],
  [71,'🌨️','sneženie'],[75,'❄️','silné sneženie'],[77,'🌨️','snehové zrná'],[80,'🌦️','prehánky'],[82,'⛈️','silné prehánky'],[85,'🌨️','snehové prehánky'],
  [95,'⛈️','búrka'],[96,'⛈️','búrka s krúpami']];
function wmo(c){ let r=WMO[0]; for(const x of WMO) if(c>=x[0]) r=x; return r; }
const WX={};
function wxWanted(m){
  if(!m.date||!m.time||played(m)) return false;
  const days=(new Date(m.date+'T12:00')-new Date(today()+'T12:00'))/864e5;
  return days>=0 && days<=15;
}
function weather(m,d){
  const g=groundOf(m,d); if(!g||!g.geo||!wxWanted(m)) return Promise.resolve(null);
  const key=g.geo.join(',')+'|'+m.date+'|'+m.time;
  if(!WX[key] || Date.now()-WX[key].at>30*60000){
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${g.geo[0]}&longitude=${g.geo[1]}&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m&timezone=Europe%2FBratislava&start_date=${m.date}&end_date=${m.date}`;
    WX[key]={at:Date.now(), p:fetch(u).then(r=>r.ok?r.json():null).then(j=>{
      if(!j||!j.hourly) return null;
      const want=m.date+'T'+String(+m.time.split(':')[0]).padStart(2,'0')+':00';
      const i=j.hourly.time.indexOf(want); if(i<0) return null;
      const H=j.hourly; return {t:H.temperature_2m[i],pp:H.precipitation_probability?H.precipitation_probability[i]:null,pr:H.precipitation[i],c:H.weather_code[i],w:H.wind_speed_10m[i]};
    }).catch(()=>{ delete WX[key]; return null; })};
  }
  return WX[key].p;
}
function wxHtml(x,short){
  if(!x) return '';
  const [,ic,tx]=wmo(x.c);
  const rain=(x.pp!=null?`zrážky ${x.pp} %`:'')+(x.pr>0?` (${(+x.pr).toFixed(1).replace('.',',')} mm)`:'');
  if(short) return `<div class="ref">${ic} ${Math.round(x.t)} °C, ${tx}${x.pp!=null?', zrážky '+x.pp+' %':''}</div>`;
  return `<div class="wx"><span class="wxi" aria-hidden="true">${ic}</span><div><b>${Math.round(x.t)} °C, ${tx}</b><small>${rain}${rain?', ':''}vietor ${Math.round(x.w)} km/h. Predpoveď na čas výkopu.</small></div></div>`;
}
function fillWx(root){
  (root||document).querySelectorAll('[data-wx]').forEach(el=>{
    const m=findMatch(el.dataset.wx); if(!m) return;
    weather(m, LIVE[m.id]).then(x=>{ if(el.isConnected) el.innerHTML=wxHtml(x, el.dataset.short==='1'); });
  });
}
function matchTools(m,d){
  if(m.home===BYE||m.away===BYE) return '';
  const g=groundOf(m,d);
  let h=`<div class="acts tools"><a class="btn grow" href="${esc(navUrl(m,d))}" target="_blank" rel="noopener">Navigovať${g&&g.ground?' na '+esc(g.ground):''}</a></div>`;
  if(m.home===US||m.away===US) h+=rsvp(m.id);
  if(wxWanted(m)) h+=`<div data-wx="${esc(m.id)}">${g&&g.geo?'<p class="note">Načítavam počasie…</p>':''}</div>`;
  return h;
}

/* ===== SPRÁVY Z IHRISKA (ntfy) ===== */
let NT=null, NT_AT=0, NT_ERR=false;
async function loadNtfy(force){
  if(!NTFY) return;
  if(!force && Date.now()-NT_AT<55000) return;
  NT_AT=Date.now();
  try{
    const r=await fetch(`https://ntfy.sh/${encodeURIComponent(NTFY)}/json?poll=1&since=12h`,{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    NT=(await r.text()).split('\n').filter(Boolean).map(l=>{ try{ return JSON.parse(l); }catch(e){ return null; } })
      .filter(x=>x&&x.event==='message').sort((a,b)=>b.time-a.time);
    NT_ERR=false;
  }catch(e){ NT_ERR=true; }
}
function vFeed(){
  if(!NTFY) return '';

  if(!NT.length) h+='<p class="note">Za posledných 12 hodín žiadne správy.</p>';
  else h+=NT.slice(0,15).map(x=>{ const d=new Date(x.time*1000); return `<div class="feed"><span class="ft">${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}</span><div>${x.title?`<b>${esc(x.title)}</b>`:''}<p>${esc(x.message||'')}</p></div></div>`; }).join('');
  return h+'<p class="note">Sem patria aj správy, ktoré vedúci mužstva napíše počas zápasu do ntfy. Postup je v Klub → O klube.</p>';
}

const RS={}, RSX={};
let JA=''; try{ JA=localStorage.getItem('ja')||''; }catch(e){}
function rsvp(id){ return PROXY ? `<div class="rsvp" data-rsvp="${esc(id)}"></div>` : ''; }
function squad(){ return (KLUB&&KLUB.hraci||[]).map(p=>p.name).sort((a,b)=>a.localeCompare(b,'sk')); }
function rsvpInner(id){
  const ev=(RS[id]&&RS[id].d)||{};
  const yes=Object.keys(ev).filter(n=>ev[n].o==='ano').sort((a,b)=>a.localeCompare(b,'sk'));
  const no=Object.keys(ev).filter(n=>ev[n].o==='nie').sort((a,b)=>a.localeCompare(b,'sk'));
  const none=squad().filter(n=>!ev[n]);
  const mine=JA&&ev[JA]?ev[JA].o:'';
  let h='';
  if(!JA) h+=`<div class="rsq">Prídeš? <button class="lnk" data-ja="1">Najprv vyber svoje meno</button></div>`;
  else h+=`<div class="rsq">Prídeš? <small>ako ${esc(JA)}, <button class="lnk" data-ja="1">zmeniť</button></small></div>
    <div class="acts"><button class="btn grow ${mine==='ano'?'pri':''}" data-rs="${esc(id)}" data-o="ano">Prídem</button><button class="btn grow ${mine==='nie'?'pri':''}" data-rs="${esc(id)}" data-o="nie">Neprídem</button></div>`;
  if(!RS[id]) return h+'<p class="note">Načítavam…</p>';

    h+=grp('Prídu',yes)+grp('Neprídu',no)+grp('Bez odpovede',none);

}
function paintRsvp(id){ document.querySelectorAll(`[data-rsvp="${CSS.escape(id)}"]`).forEach(el=>el.innerHTML=rsvpInner(id)); }
async function fillRsvp(root){

const CH={state:'init', msgs:[], topic:'', err:'', ws:null, wsOk:false, retry:0, poll:null, older:true, sending:false};
const lsGet=k=>{ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } };
const lsSet=(k,v)=>{ try{ v?localStorage.setItem(k,v):localStorage.removeItem(k); }catch(e){} };
let CHPIN=lsGet('chatPin'), CHADMIN=lsGet('chatAdmin');
async function chatApi(path, body){
  const r=await fetch(PROXY+path, body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status});
  return j;
}
function chatLastSeen(){ return +lsGet('chatSeen')||0; }
function chatUnread(){ const s=chatLastSeen(); return CH.msgs.filter(m=>m.id>s && m.meno!==JA).length; }
function chatMarkSeen(){ if(tab==='chat' && CH.msgs.length) lsSet('chatSeen', String(CH.msgs[CH.msgs.length-1].id)); }

async function chatStart(){
  if(!PROXY){ CH.state='off'; return; }
  if(CH.state==='loading') return;
  const was=CH.state; if(was!=='ok') CH.state='loading';
  if(!CHPIN){
    try{ const s=await chatApi('/chat/status'); CH.state=s.setup?'pin':'setup'; }catch(e){ CH.state='error'; CH.err='Chat sa nepodarilo načítať.'; }
    chatPaint(); return;
  }
  try{
    const h=await chatApi('/chat/history?pin='+encodeURIComponent(CHPIN));
    CH.msgs=h.msgs; CH.topic=h.topic; CH.older=h.msgs.length>=80; CH.state='ok'; CH.err='';
    chatConnect();
  }catch(e){
    if(e.status===403){ CHPIN=''; lsSet('chatPin',''); CH.state='pin'; CH.err='PIN už neplatí, zadaj nový.'; }
    else if(e.status===409){ CH.state='setup'; }
    else { CH.state='error'; CH.err='Chat sa nepodarilo načítať. Skontroluj internet.'; }
  }
  chatPaint(); navBadge();
}
function chatConnect(){
  if(CH.ws || !CHPIN || document.visibilityState!=='visible') return;
  let ws;
  try{ ws=new WebSocket(PROXY.replace(/^http/,'ws')+'/chat/ws?pin='+encodeURIComponent(CHPIN)); }catch(e){ chatPollOn(); return; }
  CH.ws=ws;
  ws.onopen=()=>{ CH.wsOk=true; CH.retry=0; chatPollOff(); };
  ws.onmessage=e=>{
    if(e.data==='pong') return;
    let x; try{ x=JSON.parse(e.data); }catch(err){ return; }
    if(x.type==='msg' && !CH.msgs.some(m=>m.id===x.m.id)){
      CH.msgs=CH.msgs.filter(m=>!(m.pending && m.cid && m.cid===x.m.cid));
      CH.msgs.push(x.m); chatPaint(true); navBadge();
    } else if(x.type==='del'){ CH.msgs=CH.msgs.filter(m=>m.id!==x.id); chatPaint(); navBadge(); }
  };
  ws.onclose=e=>{
    CH.ws=null; CH.wsOk=false;
    if(e.code===4001){ CHPIN=''; lsSet('chatPin',''); CH.state='pin'; CH.err='PIN bol zmenený, zadaj nový.'; chatPaint(); return; }
    chatPollOn();
    if(document.visibilityState==='visible'){ CH.retry=Math.min(CH.retry+1,6); setTimeout(chatConnect, 1000*2**CH.retry); }
  };
}
function chatPollOn(){ if(CH.poll) return; CH.poll=setInterval(async()=>{ if(document.visibilityState!=='visible'||!CHPIN) return;
  try{ const h=await chatApi('/chat/history?pin='+encodeURIComponent(CHPIN)); const had=CH.msgs.length&&CH.msgs[CH.msgs.length-1].id;
    CH.msgs=h.msgs.concat(CH.msgs.filter(m=>m.pending)); if(!had || (h.msgs.length&&h.msgs[h.msgs.length-1].id!==had)){ chatPaint(true); navBadge(); } }catch(e){} }, 15000); }
function chatPollOff(){ clearInterval(CH.poll); CH.poll=null; }
setInterval(()=>{ if(CH.ws && CH.wsOk) try{ CH.ws.send('ping'); }catch(e){} }, 45000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(CH.state==='ok') { chatStart(); } } else if(CH.ws){ CH.ws.close(); } });

const linkText=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
function chatDay(t){ const d=new Date(t), n=new Date(); const y=new Date(n.getTime()-864e5);

function chatPaint(scroll){

async function chatSend(){

/* ===== HRÁČ ZÁPASU ===== */
const MVP={};
function mvpWin(m){ const s=new Date(m.date+'T'+(m.time||'15:00')).getTime(); return {start:s, opens:s+100*60000, closes:s+105*60000+72*3600000}; }
function mvpTitle(m){ return m.home===US?`Beša – ${m.away}`:`${m.home} – Beša`; }
function mvpPolls(){
  // zápasy Beše, kde hlasovanie práve beží alebo skončilo pred menej ako 5 dňami
  const now=Date.now();
  return ours().filter(m=>m.date&&m.time).filter(m=>{ const w=mvpWin(m); return now>=w.opens && now<=w.closes+5*864e5; }).reverse();
}
function mvpDone(id){ return (KLUB&&KLUB.mvp||[]).find(p=>p.id===id); }
function mvpCandidates(m){
  const played=(KLUB&&KLUB.hraci||[]).filter(p=>(p.matches||[]).some(x=>x.id===m.id)).map(p=>p.name);
  return (played.length?played:squad()).filter(n=>n!==JA).sort((a,b)=>a.localeCompare(b,'sk'));
}
const dtl=t=>{ const d=new Date(t); return DNI[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'. o '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); };
function mvpBanner(m){
  if(!PROXY) return '';
  const w=mvpWin(m), done=mvpDone(m.id), st=MVP[m.id];
  if(Date.now()>w.closes){
    const r=done||(st&&st.results&&st.results.length?{winners:st.results.filter(x=>x[1]===st.results[0][1]).map(x=>x[0]),top:st.results}:null);
    if(!r) return '';
    return `<button class="mvpb done" data-mvp="${esc(m.id)}"><span class="mvi">🏆</span><span><b>Hráč zápasu ${esc(mvpTitle(m))}</b><small>${r.winners.map(esc).join(', ')}, ${r.top[0][1]} ${r.top[0][1]===1?'hlas':r.top[0][1]<5?'hlasy':'hlasov'}</small></span></button>`;
  }
  const mine=st&&st.mine;
  return `<button class="mvpb" data-mvp="${esc(m.id)}"><span class="mvi">🏆</span><span><b>Hlasuj za hráča zápasu</b><small>${esc(mvpTitle(m))}, do ${dtl(w.closes)}${mine?`. Tvoj hlas: ${esc(mine)}`:''}</small></span></button>`;
}
async function mvpFetch(ids){
  if(!PROXY||!CHPIN||!ids.length) return;
  try{ const j=await chatApi('/mvp/get?pin='+encodeURIComponent(CHPIN)+'&meno='+encodeURIComponent(JA||'')+'&ids='+encodeURIComponent(ids.join(',')));
    Object.assign(MVP,j); }catch(e){}
}
function fillMvp(root){
  const els=[...(root||document).querySelectorAll('[data-mvpslot]')]; if(!els.length) return;
  const ids=[...new Set(els.map(e=>e.dataset.mvpslot))];
  const paint=()=>els.forEach(el=>{ const m=findMatch(el.dataset.mvpslot); if(m&&el.isConnected) el.innerHTML=mvpBanner(m); });
  paint();
  const stale=ids.filter(id=>!MVP[id]||Date.now()-(MVP[id]._at||0)>60000);
  if(stale.length) mvpFetch(stale).then(()=>{ stale.forEach(id=>{ if(MVP[id]) MVP[id]._at=Date.now(); }); paint(); });
}
function mvpSlots(){ return mvpPolls().map(m=>`<div data-mvpslot="${esc(m.id)}"></div>`).join(''); }

async function openMvp(id){
  const m=findMatch(id); if(!m) return;
  const close=`<button class="ibtn" data-close="1" aria-label="Zavrieť"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  const w=mvpWin(m), head=`<h3><span>Hráč zápasu</span>${close}</h3><p class="note" style="margin-top:-6px">${esc(mvpTitle(m))}${m.hs!=null?' '+m.hs+':'+m.as:''}, ${dLabel(m.date)}</p>`;

      <div class="acts"><input type="text" id="mvpPin" inputmode="numeric" autocomplete="off" placeholder="PIN" style="flex:1"><button class="btn pri" data-mvppin="${esc(id)}">Pokračovať</button></div>`); return; }
  if(!JA){ pickName(); return; }
  openSheet(head+'<p class="note">Načítavam…</p>');
  await mvpFetch([id]); const st=MVP[id]||{exists:false}; if(MVP[id]) MVP[id]._at=Date.now();
  const now=Date.now();
  let h=head;

    const res=st.results||(mvpDone(id)||{}).top||[];

    else h+='<h2 style="margin-top:4px">Výsledky</h2>'+res.map((r,i)=>`<div class="mvr ${r[1]===res[0][1]?'win':''}"><span>${r[1]===res[0][1]?'🏆 ':''}${esc(r[0])}</span><b>${r[1]}</b></div>`).join('')+`<p class="note">Hlasovanie skončilo ${dtl(w.closes)}.</p>`;
    openSheet(h); return;
  }

function rateOf(p,type){ const own=type==='trening'?p.rt:p.rz; return (own!=null&&own!=='')?+own:(+D.rates[type]||0); }
function monthCalc(month){
  const evs=D.events.filter(e=>ym(e.date)===month);
  return D.players.map(p=>{
    const t=evs.filter(e=>e.type==='trening'&&e.present.includes(p.id)).length;
    const z=evs.filter(e=>e.type==='zapas'&&e.present.includes(p.id)).length;
    const pd=D.paid[month+'|'+p.id];
    return {p,t,z,sum:pd?pd.amount:t*rateOf(p,'trening')+z*rateOf(p,'zapas'),paid:pd};

}

function aktUnseen(){ const k=aktNewest(); let s=''; try{ s=localStorage.getItem('aktSeen')||''; }catch(e){} return k && k!==s; }

function vKlub(){
  const segs=[['akt','Aktuality'],['stat','Štatistiky'],['foto','Fotky'],['info','O klube']];
  let h=`<div class="seg">${segs.map(([k,n])=>`<button data-ks="${k}" class="${ksub===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(ksub==='akt'){ h+=vAkt(); try{ localStorage.setItem('aktSeen',aktNewest()); }catch(e){} }
  else if(ksub==='stat') h+=vStat();
  else if(ksub==='foto') h+=vFoto();
  else h+=vInfo();
  return h;
}

function vStat(){
  if(!KLUB) return '<p class="note">Načítavam…</p>';
  const H=KLUB.hraci||[];
  if(!H.length) return '<div class="empty">Štatistiky sa objavia po prvom odohranom zápase so zápisom.</div>';
  const hasHz=H.some(p=>p.hz);
  const cols=[['z','Z','Odohrané zápasy'],['min','Min','Odohrané minúty'],['g','G','Góly'],...(hasHz?[['hz','🏆','Hráč zápasu']]:[]),['zk','ŽK','Žlté karty'],['ck','ČK','Červené karty']];
  const list=[...H].sort((a,b)=>(b[statSort]-a[statSort])||(b.g-a.g)||(b.z-a.z)||a.name.localeCompare(b.name,'sk'));
  const top=[...H].sort((a,b)=>b.g-a.g)[0], goals=H.reduce((s,p)=>s+p.g,0);
  let h=`<div class="tiles"><div><small>Zápasy</small><b>${KLUB.zapasy}</b></div><div><small>Góly hráčov</small><b>${goals}</b></div><div><small>Najlepší strelec</small><b class="tname">${top&&top.g?esc(top.name.split(' ').slice(-1)[0])+' '+top.g:'–'}</b></div></div>`;
  h+=`<table class="lt st"><thead><tr><th class="l">Hráč</th>${cols.map(([k,n,t])=>`<th><button data-ss="${k}" class="${statSort===k?'on':''}" title="${t}">${n}</button></th>`).join('')}</tr></thead><tbody>`;
  list.forEach(p=>{
    const warn=ZLTE && p.zk>0 && p.zk%ZLTE===ZLTE-1;
    h+=`<tr data-pl="${esc(p.name)}"><td class="tm"><div><span class="nr">${p.nr??''}</span>${esc(p.name)}${p.gk?' <small class="mute">(B)</small>':''}</div></td><td>${p.z}</td><td>${p.min}</td><td class="pts">${p.g||''}</td>${hasHz?`<td>${p.hz||''}</td>`:''}<td>${p.zk||''}${warn?' <span class="warn" title="Ďalšia žltá karta znamená stop">!</span>':''}</td><td>${p.ck||''}</td></tr>`;
  });
  h+='</tbody></table><p class="note">Ťukni na stĺpec pre zoradenie, na hráča pre jeho zápasy. Počítané zo zápisov o stretnutí na Sportnete, len majstrovské zápasy tejto sezóny.'+(hasHz?' 🏆 = koľkokrát bol hráčom zápasu podľa hlasovania hráčov.':'')+(ZLTE?` Výkričník: hráčovi chýba jedna žltá do stopky (${ZLTE} ŽK).`:'')+'</p>';
  return h;
}
function openPlayer(name){
  const p=(KLUB&&KLUB.hraci||[]).find(x=>x.name===name); if(!p) return;
  const close=`<button class="ibtn" data-close="1" aria-label="Zavrieť"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  let h=`<h3><span>${p.nr!=null?p.nr+' ':''}${esc(p.name)}</span>${close}</h3>`;
  h+=`<div class="tiles t5"><div><small>Zápasy</small><b>${p.z}</b></div><div><small>V základe</small><b>${p.zs}</b></div><div><small>Minúty</small><b>${p.min}</b></div><div><small>Góly</small><b>${p.g}</b></div><div><small>Karty</small><b>${p.zk}/${p.ck}</b></div></div>`;
  if(p.pk) h+=`<p class="note">Z toho ${p.pk} z penalty.</p>`;
  if(p.hz) h+=`<p class="note">🏆 Hráč zápasu ${p.hz}× podľa hlasovania hráčov.</p>`;
  h+='<h2>Zápasy</h2>'+p.matches.map(x=>`<div class="mrow" data-mid="${esc(x.id)}"><div class="d">${dLabel(x.date)}${x.round?'<br>'+x.round+'. kolo':''}</div><div class="t"><div>${x.home?'doma':'vonku'}: ${esc(x.opp)}</div><div class="ref">${x.start?'základ':'striedal'}, ${x.min}'${x.g?', '+'⚽'.repeat(Math.min(x.g,5))+(x.g>5?x.g:''):''}${x.zk?' 🟨':''}${x.ck?' 🟥':''}</div></div><div class="s"><div>${x.score}</div></div><div class="res ${x.res}">${x.res}</div></div>`).join('');
  openSheet(h);
}

function vFoto(){
  if(!FOTO) return '<p class="note">Načítavam…</p>';
  const A=FOTO.albums||[];
  if(!A.length) return '<div class="empty">Zatiaľ tu nie sú žiadne fotky.</div>';
  if(fAlbum!=null && A[fAlbum]){
    const a=A[fAlbum];
    return `<div class="acts"><button class="btn sm" data-alb="-1">← Albumy</button><b style="align-self:center">${esc(a.name)}</b></div><div class="phg">${a.photos.map((p,j)=>`<button class="ph" data-ph="${j}" aria-label="Fotka ${j+1}"><img src="${esc(BASE+p.n)}" alt="" loading="lazy"></button>`).join('')}</div>`;
  }
  return `<div class="albs">${A.map((a,i)=>`<button class="alb" data-alb="${i}"><img src="${esc(BASE+a.photos[0].n)}" alt="" loading="lazy"><span><b>${esc(a.name)}</b><small>${a.photos.length} ${a.photos.length===1?'fotka':a.photos.length<5?'fotky':'fotiek'}</small></span></button>`).join('')}</div>`;
}
let phIdx=0;
function openPhoto(j){
  const a=FOTO.albums[fAlbum]; if(!a) return;
  phIdx=(j+a.photos.length)%a.photos.length; const p=a.photos[phIdx];
  const close=`<button class="ibtn" data-close="1" aria-label="Zavrieť"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
  openSheet(`<h3><span>${esc(a.name)} <small class="mute">${phIdx+1}/${a.photos.length}</small></span>${close}</h3>
    <div class="lb" id="lb"><img src="${esc(BASE+p.v)}" alt="Fotka ${phIdx+1} z ${a.photos.length}"></div>
    <div class="acts" style="margin-top:10px"><button class="btn grow" data-phn="-1">← Predošlá</button><a class="btn" href="${esc(BASE+p.o)}" target="_blank" rel="noopener">Originál</a><button class="btn grow" data-phn="1">Ďalšia →</button></div>`);
  const lb=$('#lb'); let sx=null;
  lb.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
  lb.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>50) openPhoto(phIdx+(dx<0?1:-1)); });
}

function linkify(part){
  const t=part.trim();
  if(/^https?:\/\//i.test(t)) return `<a href="${esc(t)}" target="_blank" rel="noopener">${esc(t.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a>`;
  if(/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(t)) return `<a href="mailto:${esc(t)}">${esc(t)}</a>`;
  if(/^\+?[\d][\d\s\/]{7,}$/.test(t)) return `<a href="tel:${esc(t.replace(/[\s\/]/g,''))}">${esc(t)}</a>`;
  return esc(t);
}
function vInfo(){
  let h='';
  const secs=[]; let cur=null;
  (KTXT||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const l=raw.trim(); if(l.startsWith('#')) return;
    const m=l.match(/^==+\s*(.+)$/);
    if(m){ cur={name:m[1].replace(/=+$/,'').trim(),lines:[]}; secs.push(cur); return; }
    if(cur) cur.lines.push(l);
  });
  secs.forEach(s=>{
    const lines=s.lines; while(lines.length&&!lines[lines.length-1]) lines.pop(); while(lines.length&&!lines[0]) lines.shift();
    if(!lines.length) return;
    h+=`<h2>${esc(s.name)}</h2><div class="kl">`;
    lines.forEach(l=>{
      if(!l){ h+='<div class="gap"></div>'; return; }
      const mp=l.match(/^mapa\s*:\s*(.+)$/i);
      if(mp){ const q=mp[1].trim(); const u=/^https?:/i.test(q)?q:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); h+=`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">Otvoriť v mapách</a>`; return; }
      if(l.includes('|')){ const p=l.split('|'); h+=`<div class="kr"><span>${esc(p[0].trim())}</span><span>${p.slice(1).map(linkify).join('<br>')}</span></div>`; return; }
      h+=`<p>${linkify(l)}</p>`;
    });
    h+='</div>';
  });
  if(!h) h='<div class="empty">Informácie o klube ešte nie sú vyplnené.</div>';
  h+='<h2>Upozornenia do mobilu</h2>';
  if(NTFY){
    h+=`<div class="kl"><p>Appka <b>ntfy</b> ti pošle upozornenie pri góle a výsledku Beše, v deň zápasu, pri zmene tréningov a pri novej aktualite.</p>
      <p>1. Nainštaluj si ntfy: <a href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">Android</a>, <a href="https://apps.apple.com/app/ntfy/id1625396347" target="_blank" rel="noopener">iPhone</a>.</p>
      <p>2. V ntfy ťukni na <b>+</b> a ako tému napíš:</p>
      <div class="acts"><code class="topic">${esc(NTFY)}</code><button class="btn sm" data-copy="${esc(NTFY)}">Kopírovať</button></div>
      <p class="note">Server nechaj predvolený (ntfy.sh). Upozornenie pri góle príde s oneskorením podľa toho, kedy Sportnet zápas aktualizuje.</p>
      <h2>Píšeš priebeh z ihriska?</h2>
      <p>V prehliadači v telefóne otvor <a href="https://ntfy.sh/${esc(encodeURIComponent(NTFY))}" target="_blank" rel="noopener">ntfy.sh/${esc(NTFY)}</a>, správu napíš do políčka dole na stránke a odošli. Stránku si ulož medzi záložky alebo pridaj na plochu.</p>
      <p>Píš krátko, napríklad <b>1:0 Varga 23'</b> alebo <b>Polčas 1:1</b>. Správa hneď príde všetkým a ukáže sa v appke v časti Live.</p></div>`;
  } else h+='<p class="note">Upozornenia ešte nie sú zapnuté.</p>';
  const ics=SITE+'data/kalendar.ics', web=ics.replace(/^https?:/,'webcal:');
  h+=`<h2>Kalendár</h2><div class="kl"><p>Zápasy Beše a tréningy v kalendári tvojho telefónu. Zmeny sa do neho prenesú samy.</p>
    <div class="acts"><a class="btn grow" href="https://calendar.google.com/calendar/r?cid=${encodeURIComponent(web)}" target="_blank" rel="noopener">Google kalendár</a><a class="btn grow" href="${esc(web)}">iPhone</a></div>
    <p class="note">Na Androide sa kalendár najľahšie pridá raz na počítači cez odkaz Google kalendár, potom sa sám objaví aj v telefóne. Google zmeny načítava s oneskorením, niekedy až o deň, preto pri tréningoch zrušených na poslednú chvíľu sa radšej spoľahni na upozornenia.</p></div>`;
  return h;
}

document.addEventListener('click',e=>{
  const pl=e.target.closest('[data-pl]');
  if(pl){ openPlayer(pl.dataset.pl); return; }
  const mr=e.target.closest('[data-mid]');
  if(mr && !e.target.closest('button')){ openMatch(mr.dataset.mid); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.close){ closeSheet(); return; }
  if(Object.keys(b.dataset).some(k=>k.startsWith('ch'))){ chatClick(b); return; }
  if(APP && vedClick(b)) return;
  if(b.id==='bTheme'){ toggleTheme(); return; }
  if(b.dataset.t){ tab=b.dataset.t; render(); scrollTo(0, tab==='chat'?document.body.scrollHeight:0); if(tab==='chat'&&CH.state==='ok'&&!CH.ws) chatConnect(); }
  else if(b.dataset.z){ zapMode=b.dataset.z; render(); }
  else if(b.dataset.tm){ tabMode=b.dataset.tm; render(); }
  else if(b.dataset.ks){ ksub=b.dataset.ks; fAlbum=null; try{localStorage.setItem('ksub',ksub);}catch(e){} render(); }
  else if(b.dataset.ss){ statSort=b.dataset.ss; render(); }
  else if(b.dataset.alb!=null){ fAlbum=+b.dataset.alb<0?null:+b.dataset.alb; render(); scrollTo(0,0); }
  else if(b.dataset.ph!=null){ openPhoto(+b.dataset.ph); }
  else if(b.dataset.phn){ openPhoto(phIdx+ +b.dataset.phn); }
  else if(b.dataset.mvp){ openMvp(b.dataset.mvp); }
  else if(b.dataset.mvpvote){ mvpVote(b.dataset.mvpvote, b.dataset.za); }
  else if(b.dataset.mvppin){ mvpPinSubmit(b.dataset.mvppin); }
  else if(b.dataset.rs){ answer(b.dataset.rs,b.dataset.o); }
  else if(b.dataset.rsl){ RSX[b.dataset.rsl]=!RSX[b.dataset.rsl]; paintRsvp(b.dataset.rsl); }
  else if(b.dataset.ja){ pickName(); }
  else if(b.dataset.jaset!=null){ setJa(b.dataset.jaset); }
  else if(b.dataset.copy){ (navigator.clipboard?navigator.clipboard.writeText(b.dataset.copy):Promise.reject()).then(()=>toast('Skopírované'),()=>toast('Označ a skopíruj text ručne')); }
  else if(b.dataset.hint){ try{localStorage.setItem('hint','0');}catch(e){} render(); }
  else if(b.id==='bRefresh') loadAll(true);
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') loadAll(false); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet();
  if($('#lb') && (e.key==='ArrowRight'||e.key==='ArrowLeft')) openPhoto(phIdx+(e.key==='ArrowRight'?1:-1)); });
if('serviceWorker' in navigator && !APP) navigator.serviceWorker.register('sw.js');
if(APP){ const nav=$('#nav'); nav.insertAdjacentHTML('beforeend','<button data-t="ved">Vedenie</button>'); nav.style.gridTemplateColumns='repeat(7,1fr)'; }
loadAll(false).then(pollLive).then(()=>{ if(PROXY&&CHPIN) chatStart(); });
setInterval(()=>{ if(document.visibilityState==='visible') loadAll(false); }, 5*60000);
setInterval(pollLive, 2*60000);
setInterval(()=>{ if(tab==='live' && NTFY && document.visibilityState==='visible') loadNtfy(true).then(()=>{ if(tab==='live') render(); }); }, 60000);
</script>
</body>
</html>

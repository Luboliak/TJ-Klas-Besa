function pkFkNew(){
  // priamy kop: lopta z rôznych miest pred šestnástkou, múr kryje bližšiu žrď, brankár stojí na vzdialenejšej strane
  const bx=.3+Math.random()*.4, left=bx<.5, w=.38+Math.random()*.08, o=Math.random()*.06;
  PK.fk=left?{bx,left,uLo:o,uHi:o+w,uK:.7}:{bx,left,uLo:1-o-w,uHi:1-o,uK:.3};
}
if(PK.mode==='pv') pkFkNew();
function pkGeo(W,H){ const pv=PK.mode==='pv'&&PK.fk; return {gx0:W*.13, gx1:W*.87, gyT:H*.17, gyB:H*.44, bx:W*(pv?PK.fk.bx:.5), by:H*(pv?.79:.72), br:W*(pv?.026:.03), pv:!!pv}; }
function pkGauss(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function pkKeeper(){ return PK_GK[(PK.kick+PK.k0)%2]; }
function pkReset(){ Object.assign(PK,{st:'aim', goals:0, kick:0, k0:Math.random()<.5?0:1, aim:null, shot:null, hist:[], saved:false}); if(PK.mode==='pv') pkFkNew(); }
function pkShoot(){
  const g=pkKeeper(), p=PK.pow, lvl=PK.goals;
  const sig=(.035+Math.abs(p-.72)*.3)*(PK.mode==='pv'?1.6:1); // z diaľky je strela menej presná
  const bu=PK.aim.u+pkGauss()*sig; let bv=Math.max(.04,PK.aim.v+pkGauss()*sig*.8+Math.max(0,p-.88)*2.6);
  // múr: nízka alebo slabá strela za múr sa zastaví, prisilná cez múr nestihne klesnúť
  const behind=PK.mode==='pv'&&PK.fk&&bu>=PK.fk.uLo&&bu<=PK.fk.uHi;
  if(behind&&p>.84) bv+=.25;
  const blocked=behind&&bv<=1&&(bv<.55||p<.45);
  const pv=PK.mode==='pv'&&PK.fk, uK=pv?PK.fk.uK:.5, cl=u=>Math.max(.12,Math.min(.88,u));
  const zones=pv?[[cl(uK-.4),.25],[cl(uK-.4),.7],[uK,.32],[cl(uK+.3),.2],[cl(uK+.3),.62]]:[[.2,.2],[.2,.62],[.5,.32],[.8,.2],[.8,.62]];
  let zi; const smart=Math.min(.55,.1+lvl*.035);
  if(PK.hist.length>=2&&Math.random()<smart){
    const L=PK.hist.filter(x=>x.u<.4).length, R=PK.hist.filter(x=>x.u>.6).length, hi=PK.hist.filter(x=>x.v>.5).length*2>PK.hist.length;
    const C=PK.hist.filter(x=>x.u>=.35&&x.u<=.65).length;
    zi=C*2>=PK.hist.length?2:L>R?(hi?1:0):R>L?(hi?4:3):2;
  } else { const w=[1,1,1.3,1,1], s=Math.random()*5.3; let a=0; zi=4; for(let i=0;i<5;i++){ a+=w[i]; if(s<a){ zi=i; break; } } }
  const z=zones[zi], mult=(pv?1.15:Math.min(1.3,1+lvl*.02))*(p<.4?1.35:1);
  let rx=g.rx*mult, ry=g.ry*mult; if(zi===2){ rx=.16*mult; ry=.55*mult; }
  const corner=Math.abs(bu-.5)>.28;
  if(corner&&g.slabe==='hore'&&bv>.6) ry*=.8;
  if(corner&&g.slabe==='dole'&&bv<.3) rx*=.8;
  const off=bu<0||bu>1||bv>1, post=off&&((bu>-.035&&bu<0)||(bu>1&&bu<1.035)||(bv>1&&bv<1.05&&bu>-.035&&bu<1.035));
  const dx=(bu-z[0])/rx, dy=(bv-z[1])/ry, save=!off&&!blocked&&dx*dx+dy*dy<=1;
  PK.hist.push({u:PK.aim.u,v:PK.aim.v}); if(PK.hist.length>8) PK.hist.shift();
  PK.shot={bu,bv,zi,z,uK,save:save||blocked,blocked,behind,off,post,fly:(pv?560:430)+(1-p)*320, res:blocked?'Do múru!':off?(post?'Žrď!':'Vedľa!'):save?'Chytil!':'GÓÓÓL!'};
  PK.st='fly'; PK.t0=performance.now();
}

  const cv=e.currentTarget, r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, W=r.width, H=r.height, G=pkGeo(W,H);

function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
function pkDrawKeeper(c,g,x,foot,gh,ang,lift,arms,ts){
  const h=g.h*gh, w=g.w*gh;
  c.save(); c.translate(x,foot-lift); c.rotate(ang);
  const leg=w*.3, hip=-.46*h;

    c.fillStyle=g.tien; c.fillRect(s*w*.2-leg/2,hip*.5,leg,-hip*.5); c.fillStyle='#111'; rr(c,s*w*.2-leg*.6,-h*.035,leg*1.2,h*.035,3); c.fill(); });
  c.fillStyle='#1b1b1b'; rr(c,-w*.48,hip,w*.96,-hip*.4,4); c.fill(); // trenírky
  // ruky
  const sh=-.8*h, al=.38*h;
  [-1,1].forEach(s=>{ const a=-s*(.45+2.35*arms); // 0 = dole do strán, 1 = hore nad hlavou
    c.save(); c.translate(s*w*.42,sh); c.rotate(a);

function vPK(){
  const pv=PK.mode==='pv';
  let h=`<div class="seg" style="margin-bottom:10px"><button data-pkm="pk" class="${pv?'':'on'}">Penalty</button><button data-pkm="pv" class="${pv?'on':''}">Priame kopy</button></div>`;
  if(pv) h+=`<p class="note" style="margin-top:0">${PV_N} priamych kopov z rôznych miest pred šestnástkou. Múr kryje bližšiu žrď, brankár čaká na druhej strane. Ponad múr prejde len vysoká strela so silou v zelenom: slabá skončí v múre, prisilná nestihne klesnúť a letí ponad bránku.</p>`;
  else h+=`<p class="note" style="margin-top:0">Kopeš penalty, kým nepremeníš. V bráne sa striedajú naši dvaja brankári: <b>žltý</b> je pevnejší, v strede ho ťažko prekonáš, ale horné rohy mu robia problém. <b>Fialový</b> je vysoký a tenký, hore dočiahne, no k zemi sa dostane pomalšie. Ťukni do brány, kam mieriš, a potom ťukni znova, aby si zastavil silu v zelenom.</p>`;
  h+='<div class="pkw"><canvas id="pkc" aria-label="Pokutové kopy, hra"></canvas></div>';
  if(!(PROXY&&CHPIN&&JA)) h+='<p class="note">Do poradia sa zapíšeš, keď si v Tipovačke zadáš klubový PIN a vyberieš meno.</p>';
  else if(PK.st==='over'&&PK.saved) h+='<p class="note">Séria zapísaná do poradia.</p>';
  if(PROXY){ if(!PK.board||PK.boardM!==PK.mode) pkBoard(); const B=PK.boardM===PK.mode?(PK.board||{}).best||[]:[];
    h+=`<h2>${pv?'Najviac gólov z '+PV_N:'Najdlhšie série'}</h2>`+(B.length?boardTable(B.map(x=>[x.meno,x.score]),'Góly'):'<p class="note">Zatiaľ nikto. Buď prvý.</p>'); }

}

function koClick(d){
  if(d.kovz){ KO.vz=d.kovz; KO.dirty=true; render(); return true; }
  if(d.kohint){ KO.hint=!KO.hint; KO.dirty=true; render(); return true; }
  if(d.kozad){ const v=KO_VZORY.filter(x=>x.f); const z=v[Math.floor(Math.random()*v.length)]; KO.zad={vz:z.id,t:KO_TRENER[Math.floor(Math.random()*KO_TRENER.length)]}; KO.vz=z.id; KO.dirty=true; render(); return true; }
  if(d.kogo){ koStart(); return true; }
  if(d.koend!==undefined){ if(d.koend==='1') koFinish(); else { KO.st='menu'; KO.dirty=true; render(); } return true; }
  if(d.komenu){ KO.st='menu'; KO.cells=null; KO.dirty=true; render(); return true; }

  return false;
}

  const list=[...H].sort((a,b)=>(b[statSort]-a[statSort])||(b.g-a.g)||(b.z-a.z)||a.name.localeCompare(b.name,'sk'));

function linkify(part){
  const t=part.trim();
  if(/^https?:\/\//i.test(t)) return `<a href="${esc(t)}" target="_blank" rel="noopener">${esc(t.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a>`;
  if(/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(t)) return `<a href="mailto:${esc(t)}">${esc(t)}</a>`;
  if(/^\+?[\d][\d\s\/]{7,}$/.test(t)) return `<a href="tel:${esc(t.replace(/[\s\/]/g,''))}">${esc(t)}</a>`;
  return esc(t);
}

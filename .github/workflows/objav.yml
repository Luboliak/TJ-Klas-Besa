name: Objaviť súťaže (jednorazovo)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objav:
    runs-on: ubuntu-latest
    steps:
      - name: Kontexty skupiny Západ
        run: |
          for s in tabulky/ "" timy/ vysledky/; do
            curl -sL -A "Mozilla/5.0" "https://sportnet.sme.sk/futbalnet/z/sfz/s/iii-liga/$s" > t.html
            echo "== $s $(wc -c < t.html) $(grep -o '6a173c66c9a61a70ee926736' t.html | wc -l)"
            grep -oE '/futbalnet/k/[a-z0-9-]+/' t.html | sort -u | wc -l
          done
          curl -sL -A "Mozilla/5.0" "https://sportnet.sme.sk/futbalnet/z/sfz/s/iii-liga/timy/" | grep -oE '/futbalnet/k/[a-z0-9-]+/tim/[a-z0-9-]+/' | sort -u

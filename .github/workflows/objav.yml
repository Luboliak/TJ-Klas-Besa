name: Objaviť súťaže (jednorazovo)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objav:
    runs-on: ubuntu-latest
    steps:
      - name: Swagger a pokusy
        run: |
          curl -s https://api.sportnet.online/v1/docs/swagger.json | head -c 3200; echo
          C=6a0da2fa5736165c0ec9843e; P=6a173c66c9a61a70ee926736
          for U in "v1/public/sfz/competitions/$C/parts/$P/results" "v1/public/competitions/$C/parts/$P/results" "v1/ppo/sfz/competitions/$C/parts/$P/results" "v1/public/sfz/competitions/$C/parts/$P/matches" "v1/public/competitions/$C/parts/$P/matches" "v1/public/sfz/competitions/$C/parts" ; do
            echo "== $U $(curl -s -o r.json -w '%{http_code}' https://api.sportnet.online/$U) $(head -c 200 r.json)"
          done

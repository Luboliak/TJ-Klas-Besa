name: Objaviť súťaže (jednorazovo)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objav:
    runs-on: ubuntu-latest
    steps:
      - name: Skupiny 3. ligy cez parameter
        run: |
          for p in 6a173c66c9a61a70ee926736 6a173c81c9a61a70ee926737; do
            for u in "tabulky/?partId=$p" "vysledky/?partId=$p" "program/?partId=$p"; do
              echo "== $u"; curl -sL -A "Mozilla/5.0" "https://sportnet.sme.sk/futbalnet/z/sfz/s/iii-liga/$u" | grep -oE '/futbalnet/k/[a-z0-9-]+/tim/' | sort -u | head -5
            done
          done

name: Objaviť súťaže (jednorazovo)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objav:
    runs-on: ubuntu-latest
    steps:
      - name: Odkazy na súťaže
        run: |
          for z in ulk unia-ligovych-klubov; do echo "== $z"; curl -sL -A "Mozilla/5.0" "https://sportnet.sme.sk/futbalnet/z/$z/" | grep -oE '/futbalnet/z/[a-z0-9-]+/s/[a-z0-9-]+/' | sort -u | head -30; done
          echo "== hladaj nike"; curl -sL -A "Mozilla/5.0" "https://sportnet.sme.sk/futbalnet/" | grep -oE '/futbalnet/z/[a-z0-9-]+/s/[a-z0-9-]+/' | sort -u | head -40
          for s in iii-liga monacobet-liga; do echo "== $s"; curl -sL -A "Mozilla/5.0" "https://sportnet.sme.sk/futbalnet/z/sfz/s/$s/tabulky/" | grep -oE '"(name|title)":"[^"]{2,60}"' | sort | uniq -c | sort -rn | head -25; done

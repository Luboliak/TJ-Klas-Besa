name: Objaviť súťaže (jednorazovo)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objav:
    runs-on: ubuntu-latest
    steps:
      - name: Swagger
        run: |
          for s in https://api.sportnet.online/v1/swagger.json https://api.sportnet.online/v1/docs/swagger.json https://api.sportnet.online/swagger.json https://api.sportnet.online/v1/api-docs; do
            c=$(curl -s -o s.json -w "%{http_code}" "$s"); echo "$s $c $(wc -c < s.json)"
            if [ "$c" = 200 ]; then python3 -c "
          import json;d=json.load(open('s.json'));ps=[p for p in d.get('paths',{}) if 'part' in p.lower() and ('result' in p.lower() or 'match' in p.lower() or 'table' in p.lower())]
          print(len(d.get('paths',{})),'paths'); [print(p) for p in ps[:40]]"; break; fi
          done

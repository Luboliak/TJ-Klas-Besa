name: Objaviť súťaže (jednorazovo)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objav:
    runs-on: ubuntu-latest
    steps:
      - name: Odkazy na súťaže
        run: |
          for z in sfz zsfz bfz ssfz vsfz; do
            echo "== $z"
            curl -sL -A "Mozilla/5.0" "https://sportnet.sme.sk/futbalnet/z/$z/" | grep -oE '/futbalnet/z/[a-z0-9-]+/s/[a-z0-9-]+/' | sort -u | head -60
          done

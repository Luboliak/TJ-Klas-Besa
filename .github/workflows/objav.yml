name: Objaviť súťaže (jednorazovo)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  objav:
    runs-on: ubuntu-latest
    steps:
      - name: Tabuľka na stránke tímu
        run: |
          for s in "" tabulky/ tabulka/ sutaze/; do
            U=https://sportnet.sme.sk/futbalnet/k/fc-nitra/tim/dospeli-m-a/$s
            curl -sL -A "Mozilla/5.0" "$U" > t.html
            echo "== $s $(wc -c < t.html) luzna:$(grep -o 'Dunajská Lužná' t.html | wc -l) saľa:$(grep -o 'Šaľa' t.html | wc -l) tr:$(grep -o '<tr' t.html | wc -l)"
            grep -oE 'href="/futbalnet/k/fc-nitra/tim/dospeli-m-a/[a-z/-]*"' t.html | sort -u | head
          done

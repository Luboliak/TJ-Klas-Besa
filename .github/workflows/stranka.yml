name: Ligy a stránka

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
    - cron: '*/30 11-19 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stranka
  cancel-in-progress: false

jobs:
  stranka:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Stiahnuť ligy zo Sportnetu
        run: |
          pip install requests beautifulsoup4
          python stiahni.py

      - name: Uložiť údaje do repozitára
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/ligy.json
          git diff --cached --quiet || (git commit -m "Aktualizácia líg" && git push) || true

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v5
